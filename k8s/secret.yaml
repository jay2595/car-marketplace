# EXAMPLE ONLY - do not commit real secrets.
# In production create this from Azure Key Vault (CSI driver) or:
#   kubectl create secret generic car-marketplace-secret \
#     --from-literal=SESSION_SECRET='...' -n car-marketplace
apiVersion: v1
kind: Secret
metadata:
  name: car-marketplace-secret
  labels:
    app: car-marketplace
type: Opaque
stringData:
  SESSION_SECRET: "change-me-in-key-vault"
