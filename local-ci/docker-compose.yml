name: car-marketplace-ci

services:
  jenkins:
    build: ./jenkins
    image: cm-jenkins:local
    container_name: cm-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    networks: [ci]

  sonarqube:
    image: sonarqube:community
    container_name: cm-sonarqube
    restart: unless-stopped
    depends_on: [sonar-db]
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Elasticsearch enforces a bootstrap check that -Xms must equal -Xmx.
      # Setting only -Xmx leaves Xms at the JVM default and ES refuses to start.
      SONAR_WEB_JAVAOPTS: -Xms512m -Xmx1g
      SONAR_CE_JAVAOPTS: -Xms512m -Xmx1g
      SONAR_SEARCH_JAVAOPTS: -Xms1g -Xmx1g
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks: [ci]

  sonar-db:
    image: postgres:16-alpine
    container_name: cm-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    networks: [ci]

volumes:
  jenkins_home:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db:

networks:
  ci:
    driver: bridge